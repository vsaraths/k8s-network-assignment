apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: imesh-client:1.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - while true; do python client.py; sleep 10; done
          env:
            - name: FRONTEND_URL
              value: "http://frontend-service:8081"
